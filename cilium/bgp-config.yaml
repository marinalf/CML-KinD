# eBGP: cluster AS 65001 <-> fabric AS 65000, one session per node over its
# dedicated leaf-facing eth1 interface (peer/local addresses set per node
# below in CiliumBGPNodeConfigOverride).
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: fabric-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: cluster-instance
      localASN: 65001
      peers:
        - name: leaf-peer
          peerASN: 65000
          peerConfigRef:
            name: leaf-peer-config
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: leaf-peer-config
spec:
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: pod-cidr-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: PodCIDR
---
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: kind-cluster-control-plane
spec:
  bgpInstances:
    - name: cluster-instance
      peers:
        - name: leaf-peer
          peerAddress: 198.19.0.1/30
          localAddress: 198.19.0.2/30
---
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: kind-cluster-worker
spec:
  bgpInstances:
    - name: cluster-instance
      peers:
        - name: leaf-peer
          peerAddress: 198.19.0.5/30
          localAddress: 198.19.0.6/30
---
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: kind-cluster-worker2
spec:
  bgpInstances:
    - name: cluster-instance
      peers:
        - name: leaf-peer
          peerAddress: 198.19.0.9/30
          localAddress: 198.19.0.10/30
---
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: kind-cluster-worker3
spec:
  bgpInstances:
    - name: cluster-instance
      peers:
        - name: leaf-peer
          peerAddress: 198.19.0.13/30
          localAddress: 198.19.0.14/30
